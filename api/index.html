            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn-discord:hover {
            background: #b51c3e;
            box-shadow: 0 0 15px rgba(217, 38, 78, 0.5);

        .footer {
